<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D</title>
    
    <!-- Script oficial de model-viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        model-viewer {
            width: 90vw;
            height: 85vh;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="panel-v1.glb" 
        skybox-image="fondo_3d.hdr" 
        environment-image="fondo_3d.hdr"
        camera-controls>
    </model-viewer>

</body>
</html>
