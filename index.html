<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor 3D - Solar Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151922;color:#eef2f8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#viewer{position:fixed;inset:0}
canvas{display:block;touch-action:none}
#status{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;max-width:92vw;padding:9px 14px;border-radius:11px;background:#0f172ad9;border:1px solid #ffffff20;font-size:12px;text-align:center;backdrop-filter:blur(10px)}
#reset{position:fixed;right:16px;bottom:16px;z-index:30;padding:11px 14px;border-radius:11px;border:1px solid #ffffff2b;background:#0f172ad9;color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
#help{position:fixed;left:16px;bottom:16px;z-index:30;padding:10px 13px;border-radius:11px;border:1px solid #ffffff20;background:#0f172acb;font-size:12px;line-height:1.45;pointer-events:none;backdrop-filter:blur(10px)}

#connectors{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18;overflow:visible}
.connector{stroke:rgba(255,255,255,.58);stroke-width:1.5;vector-effect:non-scaling-stroke}
.connector-dot{fill:#fff;stroke:rgba(15,23,42,.9);stroke-width:4;vector-effect:non-scaling-stroke}

#cards{position:fixed;inset:0;pointer-events:none;z-index:20}
.component-card{position:absolute;width:220px;transform:translateX(-50%);padding:11px 12px 10px;border-radius:14px;background:rgba(15,23,42,.93);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 36px rgba(0,0,0,.38);backdrop-filter:blur(12px);color:#eef2f8;transition:opacity .12s ease;font-size:11px;line-height:1.36}
.component-card.hidden{opacity:0;visibility:hidden}
.component-card h3{margin:0 0 6px;display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.15;color:#fff}
.component-card .num{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111827;font-size:11px;font-weight:900}
.component-card p{margin:4px 0;color:#dce6f3}
.component-card strong{color:#fff}

@media(max-width:700px){
  .component-card{width:158px;padding:8px 9px 8px;border-radius:12px;font-size:9.5px;line-height:1.28}
  .component-card h3{font-size:11px;margin-bottom:5px;gap:5px}
  .component-card .num{width:19px;height:19px;flex-basis:19px;font-size:10px}
  #help{left:8px;bottom:8px;right:102px;font-size:10px;padding:8px 9px}
  #help br{display:none}
  #reset{right:8px;bottom:8px;padding:9px 10px;font-size:11px}
  #status{top:8px;font-size:11px;padding:7px 10px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="viewer" aria-label="Visor interactivo del solar tracker"></div>
<svg id="connectors" aria-hidden="true"></svg>
<div id="cards" aria-label="Información de componentes"></div>
<div id="status" role="status">Cargando visor…</div>
<div id="help">Izquierdo: rotar · Derecho: mover · Rueda: zoom<br>En móvil: un dedo para girar · dos para zoom</div>
<button id="reset" type="button">Restablecer vista</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const CONFIG={
  modelo:'./panel-v1.glb',
  hdri:'./fondo_3d.hdr',
  mostrarHDRIComoFondo:true,
  exposicion:1,
  giroHDRI:0,
  colorFondo:'#151922'
};

/*
  IMPORTANTE:
  Estas referencias ya NO son posiciones aproximadas.
  Se tomaron de los nombres reales de los nodos del panel-v1.glb que subiste.
*/
const COMPONENTES=[
  {
    numero:1,
    nombre:'Servomotores SG90',
    nodos:['Sketchfab_model','Sketchfab_model002'],
    que:'Actuadores que pueden girar hasta una posición angular controlada.',
    funcion:'Reciben órdenes del Arduino y mueven la estructura para orientar el panel hacia la zona con mayor luz.'
  },
  {
    numero:2,
    nombre:'Arduino Nano',
    nodos:['Scene_1'],
    que:'Microcontrolador que ejecuta el programa del sistema.',
    funcion:'Lee los sensores LDR, compara la intensidad de luz y decide cuánto deben girar los servomotores.'
  },
  {
    numero:3,
    nombre:'Protoboard',
    nodos:['Sketchfab_model001'],
    que:'Placa de pruebas para conectar componentes sin soldar.',
    funcion:'Interconecta Arduino, sensores, resistencias y alimentación durante el prototipado del solar tracker.'
  },
  {
    numero:4,
    nombre:'Resistencias 10 kΩ',
    nodos:['Sketchfab_model003','Sketchfab_model009','Sketchfab_model010','Sketchfab_model011'],
    que:'Componentes eléctricos que controlan la relación entre corriente y voltaje.',
    funcion:'Junto con los LDR forman divisores de tensión para convertir los cambios de luz en señales que el Arduino puede medir.'
  },
  {
    numero:5,
    nombre:'Sensores LDR',
    nodos:['Sketchfab_model005','Sketchfab_model006','Sketchfab_model007','Sketchfab_model008'],
    que:'Fotoresistencias cuya resistencia varía según la cantidad de luz recibida.',
    funcion:'Actúan como los ojos del tracker: sus diferencias de lectura indican hacia qué dirección debe moverse el panel.'
  },
  {
    numero:6,
    nombre:'Panel solar',
    nodos:['Sketchfab_model012'],
    que:'Conjunto de celdas fotovoltaicas que transforma la radiación solar en electricidad.',
    funcion:'Es el elemento que el sistema orienta para mantener una incidencia de luz más favorable y mejorar la captación de energía.'
  }
];

const viewer=document.getElementById('viewer');
const status=document.getElementById('status');
const cardsLayer=document.getElementById('cards');
const connectors=document.getElementById('connectors');

const scene=new THREE.Scene();
scene.background=new THREE.Color(CONFIG.colorFondo);

const camera=new THREE.PerspectiveCamera(45,1,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=CONFIG.exposicion;
viewer.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.enablePan=true;
controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;
controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

const initialPosition=new THREE.Vector3(4,3,5);
const initialTarget=new THREE.Vector3();
camera.position.copy(initialPosition);

const fallbackLights=new THREE.Group();
fallbackLights.add(new THREE.HemisphereLight(0xe0efff,0x555566,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(4,6,5);
fallbackLights.add(sun);
scene.add(fallbackLights);

let modelRoot=null;
let modelLoaded=false;
let envLoaded=false;
const warnings=[];
const ui=[];

function makeCard(component){
  const card=document.createElement('article');
  card.className='component-card hidden';
  card.innerHTML=`
    <h3><span class="num">${component.numero}</span>${component.nombre}</h3>
    <p><strong>Qué es:</strong> ${component.que}</p>
    <p><strong>En el tracker:</strong> ${component.funcion}</p>`;
  cardsLayer.appendChild(card);

  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('class','connector');
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('class','connector-dot');
  dot.setAttribute('r','4');
  connectors.append(line,dot);

  ui.push({component,card,line,dot,objects:[]});
}
COMPONENTES.forEach(makeCard);

function resolveNodes(){
  ui.forEach(item=>{
    item.objects=item.component.nodos
      .map(name=>modelRoot.getObjectByName(name))
      .filter(Boolean);
    if(item.objects.length!==item.component.nodos.length){
      console.warn('No se encontraron todos los nodos de',item.component.nombre,item.component.nodos,item.objects);
    }
  });
}

function componentBox(objects){
  const box=new THREE.Box3();
  box.makeEmpty();
  objects.forEach(obj=>{
    obj.updateWorldMatrix(true,true);
    box.union(new THREE.Box3().setFromObject(obj));
  });
  return box;
}

function projectBox(box,w,h){
  if(box.isEmpty())return null;
  const mn=box.min,mx=box.max;
  const corners=[
    [mn.x,mn.y,mn.z],[mx.x,mn.y,mn.z],[mn.x,mx.y,mn.z],[mx.x,mx.y,mn.z],
    [mn.x,mn.y,mx.z],[mx.x,mn.y,mx.z],[mn.x,mx.y,mx.z],[mx.x,mx.y,mx.z]
  ];
  const pts=[];
  for(const c of corners){
    const v=new THREE.Vector3(...c).project(camera);
    if(!Number.isFinite(v.x)||!Number.isFinite(v.y)||!Number.isFinite(v.z))continue;
    pts.push({x:(v.x+1)*.5*w,y:(1-v.y)*.5*h,z:v.z});
  }
  if(!pts.length)return null;
  return {
    minX:Math.min(...pts.map(p=>p.x)),maxX:Math.max(...pts.map(p=>p.x)),
    minY:Math.min(...pts.map(p=>p.y)),maxY:Math.max(...pts.map(p=>p.y)),
    z:pts.reduce((a,p)=>a+p.z,0)/pts.length
  };
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function updateComponentUI(){
  if(!modelLoaded)return;
  const w=window.innerWidth,h=window.innerHeight;
  const mobile=w<=700;
  const cardW=mobile?158:220;
  const margin=mobile?7:10;

  const placed=[];

  for(const item of ui){
    if(!item.objects.length){hideItem(item);continue;}
    const box=componentBox(item.objects);
    const screen=projectBox(box,w,h);
    if(!screen || screen.z<-1.3 || screen.z>1.3 || screen.maxX<-50 || screen.minX>w+50 || screen.maxY<-50 || screen.minY>h+50){
      hideItem(item);continue;
    }

    item.card.classList.remove('hidden');
    item.line.style.display='';
    item.dot.style.display='';

    const cardH=item.card.offsetHeight||90;
    let x=(screen.minX+screen.maxX)/2;
    let y=screen.maxY+(mobile?8:12);

    x=clamp(x,cardW/2+margin,w-cardW/2-margin);
    y=clamp(y,margin,h-cardH-margin);

    /* Separación sencilla para que las tarjetas no se monten entre sí. */
    let attempts=0;
    while(attempts<10){
      const rect={left:x-cardW/2,right:x+cardW/2,top:y,bottom:y+cardH};
      const hit=placed.find(r=>!(rect.right<r.left || rect.left>r.right || rect.bottom<r.top || rect.top>r.bottom));
      if(!hit)break;
      y=hit.bottom+8;
      if(y+cardH>h-margin){
        y=Math.max(margin,screen.minY-cardH-10);
        x=clamp(x+(attempts%2===0?cardW*.72:-cardW*.72),cardW/2+margin,w-cardW/2-margin);
      }
      attempts++;
    }

    item.card.style.left=x+'px';
    item.card.style.top=y+'px';
    placed.push({left:x-cardW/2,right:x+cardW/2,top:y,bottom:y+cardH});

    const anchorX=clamp((screen.minX+screen.maxX)/2,0,w);
    const anchorY=clamp(screen.maxY,0,h);
    const lineEndX=x;
    const lineEndY=y;
    item.line.setAttribute('x1',anchorX);
    item.line.setAttribute('y1',anchorY);
    item.line.setAttribute('x2',lineEndX);
    item.line.setAttribute('y2',lineEndY);
    item.dot.setAttribute('cx',anchorX);
    item.dot.setAttribute('cy',anchorY);
  }
}

function hideItem(item){
  item.card.classList.add('hidden');
  item.line.style.display='none';
  item.dot.style.display='none';
}

function updateStatus(){
  if(!modelLoaded){
    status.hidden=false;
    status.textContent=warnings.some(w=>w.startsWith('Modelo'))?warnings.join(' · '):'Cargando modelo…';
    return;
  }
  if(CONFIG.hdri&&!envLoaded&&!warnings.some(w=>w.startsWith('HDRI'))){
    status.hidden=false;
    status.textContent='Modelo listo · cargando HDRI…';
    return;
  }
  status.textContent=warnings.join(' · ');
  status.hidden=warnings.length===0;
}

function frameModel(model){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  if(box.isEmpty())throw new Error('El GLB no contiene geometría visible.');
  const center=box.getCenter(new THREE.Vector3());
  const radius=Math.max(box.getSize(new THREE.Vector3()).length()/2,.001);
  const vfov=THREE.MathUtils.degToRad(camera.fov);
  const hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);
  const distance=radius/Math.sin(Math.min(vfov,hfov)/2)*1.15;
  initialTarget.copy(center);
  initialPosition.copy(center).add(new THREE.Vector3(1,.6,1).normalize().multiplyScalar(distance));
  camera.near=Math.max(radius/1000,.000001);
  camera.far=Math.max(radius*100,distance*10);
  camera.updateProjectionMatrix();
  controls.minDistance=radius*.15;
  controls.maxDistance=distance*6;
  resetView();
}

function resetView(){
  camera.position.copy(initialPosition);
  controls.target.copy(initialTarget);
  controls.update();
}
document.getElementById('reset').onclick=resetView;

function resize(){
  const w=viewer.clientWidth,h=viewer.clientHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  connectors.setAttribute('viewBox',`0 0 ${window.innerWidth} ${window.innerHeight}`);
}
new ResizeObserver(resize).observe(viewer);
resize();

async function loadModel(){
  try{
    const loader=new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const gltf=await loader.loadAsync(CONFIG.modelo);
    modelRoot=gltf.scene;
    scene.add(modelRoot);
    frameModel(modelRoot);
    resolveNodes();
    modelLoaded=true;
  }catch(error){
    warnings.push('Modelo: no se pudo cargar. Revisa la ruta del GLB y que sea válido.');
    console.error('Error de modelo:',error);
  }
  updateStatus();
}

async function loadEnvironment(){
  if(!CONFIG.hdri){updateStatus();return;}
  try{
    const path=new URL(CONFIG.hdri,document.baseURI).pathname.toLowerCase();
    const loader=path.endsWith('.exr')?new EXRLoader():new RGBELoader();
    const texture=await loader.loadAsync(CONFIG.hdri);
    texture.mapping=THREE.EquirectangularReflectionMapping;
    scene.environment=texture;
    if(CONFIG.mostrarHDRIComoFondo)scene.background=texture;
    const angle=THREE.MathUtils.degToRad(CONFIG.giroHDRI);
    scene.environmentRotation.y=angle;
    scene.backgroundRotation.y=angle;
    fallbackLights.visible=false;
    envLoaded=true;
  }catch(error){
    warnings.push('HDRI: no se pudo cargar. Se usa iluminación de respaldo.');
    console.error('Error de HDRI:',error);
  }
  updateStatus();
}

loadModel();
loadEnvironment();
renderer.setAnimationLoop(()=>{
  controls.update();
  updateComponentUI();
  renderer.render(scene,camera);
});
</script>
</body>
</html>
