<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Solar 3D</title>
  <!-- Cargamos la librería para visualizar 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: white;
      font-family: sans-serif;
    }
    model-viewer {
      width: 90vw;
      height: 80vh;
      border-radius: 12px;
      background-color: #2a2a2a;
    }
  </style>
</head>
<body>

  <!-- Reemplaza "mi_panel.glb" con el nombre EXACTO de tu archivo en GitHub -->
  <model-viewer 
    src="panel-v1.glb" 
    alt="Panel Solar 3D" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
