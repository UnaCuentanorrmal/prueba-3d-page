<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151922;color:#eef2f8;font-family:system-ui,sans-serif}#viewer{width:100%;height:100dvh}canvas{display:block;touch-action:none}.badge{position:fixed;left:20px;bottom:20px;padding:12px 16px;background:#111b;border:1px solid #ffffff20;border-radius:12px;pointer-events:none;font-size:13px;line-height:1.6}#status{position:fixed;left:50%;top:24px;transform:translateX(-50%);max-width:90vw;padding:10px 16px;background:#111d;border-radius:10px;font-size:13px;text-align:center}#reset{position:fixed;right:20px;bottom:20px;border:1px solid #ffffff30;border-radius:10px;background:#111b;color:white;padding:12px 16px;cursor:pointer}#reset:hover{background:#334155}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="viewer" aria-label="Visor interactivo de modelo 3D"></div>
<div id="status" role="status">Cargando visor…</div>
<div class="badge">Click izquierdo: girar · Click derecho: mover cámara · Rueda: zoom<br>En móvil: un dedo para girar · dos para zoom</div>
<button id="reset" type="button">Restablecer vista</button>
<script>
window.addEventListener('error',()=>{document.getElementById('status').textContent='No se pudo iniciar el visor. Revisa la conexión y la consola del navegador.';});
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  
// ===== CAMBIA AQUÍ LAS RUTAS DE TUS ARCHIVOS =====
// Rutas relativas: archivos subidos al mismo repositorio de GitHub.
// También puedes usar una URL HTTPS cuyo servidor permita CORS.
const CONFIG = {
  modelo: './panel-v1.glb',
  hdri: './fondo_3d.hdr', // Acepta .hdr o .exr. Usa '' para no cargar HDRI.
  mostrarHDRIComoFondo: true,
  exposicion: 1,
  giroHDRI: 0, // Grados.
  colorFondo: '#151922'
};
// ==============================================

const container=document.getElementById('viewer');
const status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(CONFIG.colorFondo);
const camera=new THREE.PerspectiveCamera(45,1,0.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=CONFIG.exposicion;
container.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.enablePan=true;

// Mouse:
// Izquierdo = rotar
// Derecho = mover/desplazar la cámara
// Rueda = zoom
controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;

// Evita que aparezca el menú contextual con clic derecho
renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());
const initialPosition=new THREE.Vector3(4,3,5);
const initialTarget=new THREE.Vector3();camera.position.copy(initialPosition);
const fallbackLights=new THREE.Group();
fallbackLights.add(new THREE.HemisphereLight(0xe0efff,0x555566,2));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,6,5);fallbackLights.add(sun);scene.add(fallbackLights);
let modelLoaded=false,envLoaded=false;
const warnings=[];
function updateStatus(){
  if(!modelLoaded){status.textContent=warnings.some(w=>w.startsWith('Modelo'))?warnings.join(' · '):'Cargando modelo…';return;}
  if(CONFIG.hdri&&!envLoaded&&!warnings.some(w=>w.startsWith('HDRI'))){status.textContent='Modelo listo · cargando HDRI…';return;}
  status.textContent=warnings.join(' · ');status.hidden=warnings.length===0;
}
function frameModel(model){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  if(box.isEmpty())throw new Error('El GLB no contiene geometría visible.');
  const center=box.getCenter(new THREE.Vector3());
  const radius=Math.max(box.getSize(new THREE.Vector3()).length()/2,0.001);
  const verticalFov=THREE.MathUtils.degToRad(camera.fov);
  const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*camera.aspect);
  const distance=radius/Math.sin(Math.min(verticalFov,horizontalFov)/2)*1.15;
  initialTarget.copy(center);
  initialPosition.copy(center).add(new THREE.Vector3(1,.6,1).normalize().multiplyScalar(distance));
  camera.near=Math.max(radius/1000,0.000001);camera.far=Math.max(radius*100, distance*10);
  camera.updateProjectionMatrix();controls.minDistance=radius*.15;controls.maxDistance=distance*6;
  resetView();
}
function resetView(){camera.position.copy(initialPosition);controls.target.copy(initialTarget);controls.update();}
document.getElementById('reset').onclick=resetView;
function resize(){const width=container.clientWidth,height=container.clientHeight;renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(container);resize();
async function loadModel(){
  try{
    const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync(CONFIG.modelo);
    scene.add(gltf.scene);frameModel(gltf.scene);modelLoaded=true;
  }catch(error){warnings.push('Modelo: no se pudo cargar. Revisa la ruta del GLB y que sea válido.');console.error('Error de modelo:',error);}
  updateStatus();
}
async function loadEnvironment(){
  if(!CONFIG.hdri){updateStatus();return;}
  try{
    const path=new URL(CONFIG.hdri,document.baseURI).pathname.toLowerCase();
    const loader=path.endsWith('.exr')?new EXRLoader():new RGBELoader();
    const texture=await loader.loadAsync(CONFIG.hdri);
    texture.mapping=THREE.EquirectangularReflectionMapping;
    scene.environment=texture;
    if(CONFIG.mostrarHDRIComoFondo)scene.background=texture;
    const angle=THREE.MathUtils.degToRad(CONFIG.giroHDRI);
    scene.environmentRotation.y=angle;scene.backgroundRotation.y=angle;
    fallbackLights.visible=false;envLoaded=true;
  }catch(error){warnings.push('HDRI: no se pudo cargar. Se usa iluminación de respaldo.');console.error('Error de HDRI:',error);}
  updateStatus();
}
loadModel();loadEnvironment();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
